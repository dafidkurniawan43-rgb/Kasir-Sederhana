<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kasir Sederhana</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap">
<style>
:root{--bg:#eef3f1;--card:#fff;--ink:#17302b;--mute:#5d7570;--line:#d5e0dc;--pri:#0f6b5c;--onpri:#fff;--acc:#f2a33a;--onacc:#2b1a00;--bad:#b3391b;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10201d;--card:#183029;--ink:#e6f2ee;--mute:#9bb5ae;--line:#2a4640;--pri:#3fbfa6;--onpri:#06231d;--bad:#ff8a69}}
:root[data-theme="dark"]{--bg:#10201d;--card:#183029;--ink:#e6f2ee;--mute:#9bb5ae;--line:#2a4640;--pri:#3fbfa6;--onpri:#06231d;--bad:#ff8a69}
*{box-sizing:inherit}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.45;padding-bottom:90px}
main{max-width:560px;margin:0 auto;padding:16px}
h1{font-size:1.5rem;font-weight:800;margin:0}
.app{font-size:.7rem;color:var(--mute)}
.wn{font:inherit;font-size:1.5rem;font-weight:800;background:none;border:0;padding:0;color:var(--ink);text-align:left;min-height:40px}
#wi{font-size:1.2rem;font-weight:800}
h2{font-size:1.05rem;font-weight:800;margin:0}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin-bottom:14px}
.today{font-size:.8rem;color:var(--mute);text-align:right}
.today b{display:block;font-size:1rem;color:var(--ink)}
section{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:14px}
.head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
button{font:inherit;cursor:pointer;border:0;border-radius:10px;min-height:44px;padding:0 14px;font-weight:600}
button:focus-visible,input:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.ghost{background:transparent;color:var(--pri);border:1px solid var(--line);min-height:36px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.prod{position:relative;text-align:left;background:var(--bg);color:var(--ink);border:1px solid var(--line);padding:10px 12px;min-height:68px;display:flex;flex-direction:column;justify-content:space-between}
.prod:active{transform:scale(.97)}
.prod span{font-weight:600}
.prod small{color:var(--pri);font-weight:800;font-size:.9rem}
.del{position:absolute;top:4px;right:4px;min-height:30px;width:30px;padding:0;background:var(--bad);color:#fff;border-radius:50%}
.add{display:grid;grid-template-columns:1fr 110px auto;gap:6px;margin-top:10px}
input{font:inherit;min-height:44px;border:1px solid var(--line);border-radius:10px;padding:0 10px;background:var(--bg);color:var(--ink);width:100%}
.add button{background:var(--pri);color:var(--onpri)}
.row{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row .n{flex:1;min-width:0}
.row .n b{display:block;font-weight:600}
.row .n small{color:var(--mute)}
.q{display:flex;align-items:center;gap:6px}
.q button{width:36px;min-height:36px;padding:0;background:var(--bg);color:var(--ink);border:1px solid var(--line);font-size:1.1rem}
.q span{min-width:20px;text-align:center;font-weight:800}
.sub{min-width:74px;text-align:right;font-weight:600}
.empty{color:var(--mute);margin:4px 0}
.sum{display:flex;justify-content:space-between;align-items:baseline;margin:12px 0 8px}
.sum b{font-size:1.6rem;font-weight:800}
.quick{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.quick button{min-height:36px;background:var(--bg);color:var(--ink);border:1px solid var(--line);font-size:.85rem}
.change{display:flex;justify-content:space-between;margin-top:12px;font-weight:600}
.change b{font-size:1.15rem}
.ok{color:var(--pri)}.no{color:var(--bad)}
.pay{width:100%;margin-top:12px;background:var(--pri);color:var(--onpri);min-height:52px;font-size:1.05rem;font-weight:800}
.pay:disabled{opacity:.4;cursor:not-allowed}
.clear{width:100%;margin-top:8px}
.pay.qr{background:var(--acc);color:var(--onacc);margin-top:8px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;padding:16px;z-index:10}
.modal[hidden]{display:none}
.box{background:var(--card);border-radius:16px;padding:16px;max-width:360px;width:100%;text-align:center}
.box img{width:100%;max-height:55vh;object-fit:contain;background:#fff;border-radius:8px}
.box b{display:block;font-size:1.6rem;margin:8px 0}
.box .pay{margin-top:8px}
.bar{position:fixed;left:0;right:0;bottom:0;padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));background:var(--acc);color:var(--onacc);display:flex;justify-content:space-between;align-items:center;font-weight:800;text-decoration:none;font-size:1.05rem;z-index:5}
.toast{position:fixed;left:16px;right:16px;bottom:80px;max-width:528px;margin:0 auto;background:var(--ink);color:var(--bg);padding:12px 14px;border-radius:12px;font-weight:600;z-index:6;display:none}
</style>
</head>
<body>
<main>
  <div class="top">
    <div><div class="app">Kasir</div><h1><button class="wn" id="wn" aria-label="Ubah nama warung"></button><input id="wi" hidden maxlength="30" aria-label="Nama warung"></h1></div>
    <div class="today">Penjualan hari ini<b id="today">Rp0</b></div>
  </div>

  <section>
    <div class="head"><h2>Produk</h2><button class="ghost" id="edit">Ubah</button></div>
    <div class="grid" id="prods"></div>
    <div class="add">
      <input id="pn" placeholder="Nama produk" maxlength="30" aria-label="Nama produk">
      <input id="pp" placeholder="Harga" inputmode="numeric" aria-label="Harga produk">
      <button id="padd">Tambah</button>
    </div>
  </section>

  <section>
    <div class="head"><h2>Harga bebas</h2></div>
    <div class="add">
      <input id="cn" placeholder="Nama (boleh kosong)" maxlength="30" aria-label="Nama barang">
      <input id="cp" placeholder="Harga" inputmode="numeric" aria-label="Harga bebas">
      <button id="cadd">Masukkan</button>
    </div>
  </section>

  <section id="cart">
    <div class="head"><h2>Keranjang</h2></div>
    <div id="items"></div>
    <div class="sum"><span>Total</span><b id="total">Rp0</b></div>
    <input id="paid" placeholder="Uang diterima" inputmode="numeric" aria-label="Uang diterima">
    <div class="quick" id="quick"></div>
    <div class="change"><span id="clab">Kembalian</span><b id="change">Rp0</b></div>
    <button class="pay" id="pay" disabled>Selesaikan pembayaran</button>
    <button class="pay qr" id="qbtn" disabled>Bayar pakai QRIS</button>
    <button class="ghost clear" id="clear">Kosongkan keranjang</button>
    <button class="ghost clear" id="qset">Atur gambar QRIS</button>
    <input type="file" id="qfile" accept="image/*" hidden>
  </section>
</main>

<a class="bar" href="#cart"><span id="cnt">0 barang</span><span id="bar">Rp0</span></a>
<div class="modal" id="modal" hidden>
  <div class="box">
    <h2>Scan QRIS</h2>
    <img id="qimg" alt="Kode QRIS">
    <b id="qtot">Rp0</b>
    <small id="qnote">Minta pembeli memasukkan nominal ini saat membayar</small>
    <button class="pay" id="qdone">Sudah dibayar</button>
    <button class="ghost clear" id="qcancel">Batal</button>
  </div>
</div>
<div class="toast" id="toast" role="status"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jsQR/1.4.0/jsQR.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<script>
(function(){
  var DEF=[{id:1,n:"Teh Botol",p:5000},{id:2,n:"Kopi Sachet",p:3000},{id:3,n:"Mie Instan",p:3500},{id:4,n:"Air Mineral",p:4000},{id:5,n:"Roti",p:6000},{id:6,n:"Gula 1 kg",p:17000}];
  var products=DEF.slice(), cart={}, sales={date:"",total:0}, editing=false, shop="", qris="", raw="", extra={};
  var $=function(i){return document.getElementById(i)};
  var rp=function(n){return "Rp"+Number(n||0).toLocaleString("id-ID")};
  var esc=function(s){var d=document.createElement("div");d.textContent=s;return d.innerHTML};
  var day=function(){return new Date().toISOString().slice(0,10)};

  function load(){
    try{shop=localStorage.getItem("kasir-warung")||"";qris=localStorage.getItem("kasir-qris")||"";raw=localStorage.getItem("kasir-qrisraw")||"";var a=JSON.parse(localStorage.getItem("kasir-produk")||"null");if(a&&a.length)products=a;
      var s=JSON.parse(localStorage.getItem("kasir-hari")||"null");if(s&&s.date===day())sales=s;}catch(e){}
    if(sales.date!==day())sales={date:day(),total:0};
  }
  function save(){try{localStorage.setItem("kasir-produk",JSON.stringify(products));localStorage.setItem("kasir-hari",JSON.stringify(sales));}catch(e){}}
  function items(){var r=products.filter(function(p){return cart[p.id]}).map(function(p){return {id:p.id,n:p.n,p:p.p}});Object.keys(extra).forEach(function(k){if(cart[k])r.push({id:k,n:extra[k].n,p:extra[k].p})});return r}
  function total(){return items().reduce(function(t,i){return t+cart[i.id]*i.p},0)}
  function count(){return Object.keys(cart).reduce(function(t,k){return t+cart[k]},0)}
  function paid(){return parseInt(($("paid").value||"").replace(/\D/g,""),10)||0}
  function toast(m){var t=$("toast");t.textContent=m;t.style.display="block";clearTimeout(toast.h);toast.h=setTimeout(function(){t.style.display="none"},2500)}

  function render(){
    $("prods").innerHTML=products.map(function(p){
      return '<button class="prod" data-id="'+p.id+'"><span>'+esc(p.n)+'</span><small>'+rp(p.p)+'</small>'+(editing?'<span class="del" data-del="'+p.id+'" role="button" aria-label="Hapus">×</span>':'')+'</button>';
    }).join("");
    $("edit").textContent=editing?"Selesai":"Ubah";
    Object.keys(extra).forEach(function(k){if(!cart[k])delete extra[k]});
    var rows=items();
    $("items").innerHTML=rows.length?rows.map(function(p){
      return '<div class="row"><div class="n"><b>'+esc(p.n)+'</b><small>'+rp(p.p)+'</small></div><div class="q"><button data-m="'+p.id+'" aria-label="Kurangi">−</button><span>'+cart[p.id]+'</span><button data-a="'+p.id+'" aria-label="Tambah">+</button></div><div class="sub">'+rp(p.p*cart[p.id])+'</div></div>';
    }).join(""):'<p class="empty">Belum ada barang. Ketuk produk di atas untuk menambah.</p>';
    var t=total();
    $("total").textContent=rp(t);$("bar").textContent=rp(t);
    $("cnt").textContent=count()+" barang";
    var q=[t,10000,20000,50000,100000].filter(function(v,i){return i===0?t>0:v>=t||i<2});
    $("quick").innerHTML=(t>0?[t,20000,50000,100000]:[]).filter(function(v,i){return i===0||v>t}).map(function(v,i){return '<button data-q="'+v+'">'+(i===0?"Uang pas":rp(v))+'</button>'}).join("");
    var d=paid()-t;
    $("clab").textContent=d<0&&t>0?"Kurang":"Kembalian";
    $("change").textContent=rp(Math.abs(t>0?d:0));
    $("change").className=t>0?(d<0?"no":"ok"):"";
    $("pay").disabled=!(t>0&&d>=0);
    $("qbtn").disabled=!(t>0);
    $("qset").textContent=qris?"Ganti gambar QRIS":"Atur gambar QRIS";
    $("today").textContent=rp(sales.total);
    $("wn").textContent=shop||"Ketuk untuk isi nama warung";
    document.title=shop||"Kasir";
  }

  $("prods").addEventListener("click",function(e){
    var del=e.target.getAttribute("data-del");
    if(del){var id=+del;products=products.filter(function(p){return p.id!==id});delete cart[id];save();render();return}
    var b=e.target.closest(".prod");if(!b)return;
    var id2=+b.getAttribute("data-id");cart[id2]=(cart[id2]||0)+1;render();
  });
  $("items").addEventListener("click",function(e){
    var m=e.target.getAttribute("data-m"),a=e.target.getAttribute("data-a");
    if(a)cart[a]++;
    if(m){cart[m]--;if(cart[m]<=0)delete cart[m]}
    render();
  });
  $("quick").addEventListener("click",function(e){var v=e.target.getAttribute("data-q");if(v){$("paid").value=v;render()}});
  $("paid").addEventListener("input",render);
  $("edit").addEventListener("click",function(){editing=!editing;render()});
  $("padd").addEventListener("click",function(){
    var n=$("pn").value.trim(),p=parseInt(($("pp").value||"").replace(/\D/g,""),10)||0;
    if(!n||p<=0){toast("Isi nama produk dan harga dulu");return}
    var id=products.reduce(function(m,x){return Math.max(m,x.id)},0)+1;
    products.push({id:id,n:n,p:p});$("pn").value="";$("pp").value="";save();render();toast(n+" ditambahkan");
  });
  $("pay").addEventListener("click",function(){
    var t=total(),d=paid()-t;
    sales.total+=t;save();cart={};$("paid").value="";render();
    toast("Lunas. Kembalian "+rp(d));window.scrollTo({top:0,behavior:"smooth"});
  });
  $("clear").addEventListener("click",function(){cart={};$("paid").value="";render()});

  function endName(){shop=$("wi").value.trim();try{localStorage.setItem("kasir-warung",shop)}catch(e){}$("wi").hidden=true;$("wn").hidden=false;render()}
  $("wn").addEventListener("click",function(){$("wi").value=shop;$("wn").hidden=true;$("wi").hidden=false;$("wi").focus()});
  $("wi").addEventListener("blur",endName);
  $("wi").addEventListener("keydown",function(e){if(e.key==="Enter")$("wi").blur()});

  function pad2(n){return ("0"+n).slice(-2)}
  function crc(s){var c=0xFFFF;for(var i=0;i<s.length;i++){c^=s.charCodeAt(i)<<8;for(var j=0;j<8;j++)c=(c&0x8000)?((c<<1)^0x1021):(c<<1);c&=0xFFFF}return ("0000"+c.toString(16).toUpperCase()).slice(-4)}
  function dyn(p,amt){var out="",done=false,am=String(amt),i=0;
    while(i+4<=p.length){var id=p.substr(i,2),l=parseInt(p.substr(i+2,2),10);if(isNaN(l))break;var v=p.substr(i+4,l);i+=4+l;
      if(id==="63"||id==="54")continue;if(id==="01")v="12";
      if(!done&&parseInt(id,10)>54){out+="54"+pad2(am.length)+am;done=true}
      out+=id+pad2(v.length)+v}
    if(!done)out+="54"+pad2(am.length)+am;
    out+="6304";return out+crc(out)}
  $("cadd").addEventListener("click",function(){
    var p=parseInt(($("cp").value||"").replace(/\D/g,""),10)||0;
    if(p<=0){toast("Isi nominalnya dulu");return}
    var k="c"+Date.now();extra[k]={n:$("cn").value.trim()||"Harga bebas",p:p};cart[k]=1;
    $("cn").value="";$("cp").value="";render();toast("Masuk keranjang")});
  $("qset").addEventListener("click",function(){$("qfile").click()});
  $("qfile").addEventListener("change",function(){
    var f=this.files[0];if(!f)return;var r=new FileReader();
    r.onload=function(){var img=new Image();
      img.onload=function(){var s=Math.min(1,1000/Math.max(img.width,img.height)),c=document.createElement("canvas");
        c.width=Math.round(img.width*s);c.height=Math.round(img.height*s);c.getContext("2d").drawImage(img,0,0,c.width,c.height);
        qris=c.toDataURL("image/png");
        try{localStorage.setItem("kasir-qris",qris)}catch(e){}
        raw="";try{if(window.jsQR){var cx=c.getContext("2d").getImageData(0,0,c.width,c.height),res=jsQR(cx.data,cx.width,cx.height);if(res&&res.data&&res.data.indexOf("000201")===0)raw=res.data}}catch(e){}
        try{localStorage.setItem("kasir-qrisraw",raw)}catch(e){}
        render();toast(raw?"QRIS tersimpan, nominal akan terisi otomatis":"Gambar tersimpan, tapi kodenya tidak terbaca. Pembeli ketik nominal sendiri")};
      img.onerror=function(){toast("Gambar tidak bisa dibaca")};img.src=r.result};
    r.readAsDataURL(f);this.value=""});
  $("qbtn").addEventListener("click",function(){
    if(!qris){toast("Atur gambar QRIS dulu di bagian bawah keranjang");return}
    var t=total(),ok=false;
    if(raw&&window.qrcode){try{var q=qrcode(0,"M");q.addData(dyn(raw,t));q.make();$("qimg").src=q.createDataURL(6,8);ok=true}catch(e){}}
    if(!ok)$("qimg").src=qris;
    $("qnote").textContent=ok?"Nominal sudah terisi otomatis. Pembeli tinggal scan dan bayar.":"Minta pembeli memasukkan nominal ini saat membayar";
    $("qtot").textContent=rp(t);$("modal").hidden=false});
  $("qdone").addEventListener("click",function(){
    sales.total+=total();save();cart={};$("paid").value="";$("modal").hidden=true;render();
    toast("Lunas via QRIS");window.scrollTo({top:0,behavior:"smooth"})});
  $("qcancel").addEventListener("click",function(){$("modal").hidden=true});

  load();render();
})();
</script>
</body>
</html>
